
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f5f9">
  <meta name="description" content="UniFlow — your semester, in one place."><title>UniFlow · Your semester, in one place</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" data-page="home"><span class="brand-symbol">u</span><span>Uni<span>Flow</span></span></a>
      <div class="nav-label">YOUR CAMPUS</div>
      <nav class="nav-group campus-nav" aria-label="Your Campus">
        <button class="nav-link active" data-page="home"><span class="nav-icon">◫</span>Dashboard</button>
        <button class="nav-link" data-page="courses"><span class="nav-icon">▤</span>Courses</button>
        <button class="nav-link" data-page="semester"><span class="nav-icon">▦</span>Timetable</button>
        <button class="nav-link" data-page="calendar"><span class="nav-icon">▧</span>Calendar</button>
        <button class="nav-link" data-page="exams"><span class="nav-icon">✳</span>Exams</button>
        <button class="nav-link" data-page="focus"><span class="nav-icon">◷</span>Focus Room</button>
        <button class="nav-link" data-page="stats"><span class="nav-icon">⌁</span>My Progress</button>
        <button class="nav-link" data-page="settings"><span class="nav-icon">⚙</span>Data &amp; backup</button>
      </nav>
      </nav>
      <div class="sidebar-bottom"><div class="semester-summary"><span class="semester-icon">✳</span><div><b id="semester-name">Semester</b><small><span id="nav-progress">0%</span> semester complete</small></div></div><div class="local-badge"><i></i> Saved on this device</div></div>
    </aside>
    <main class="main-content">
      <header class="topbar"><button class="mobile-brand" data-page="home"><span class="brand-symbol">u</span> UniFlow</button><div class="topbar-title"><span>YOUR STUDY SPACE</span><strong id="page-title">Today</strong></div><div class="topbar-right"><span id="date-label"></span><span class="avatar">U</span></div></header>
      <div id="view" class="page-content"></div>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="Mobile navigation"><button data-page="home" class="active"><span>◫</span>Home</button><button data-page="semester"><span>▦</span>Plan</button><button data-page="calendar"><span>▧</span>Calendar</button><button data-page="exams"><span>✳</span>Exams</button><button data-action="more-toggle" aria-expanded="false"><span>•••</span>More</button></nav>
  <div id="mobile-more" class="mobile-more" hidden><button data-page="courses">▤ &nbsp; Courses</button><button data-page="focus">◷ &nbsp; Focus Room</button><button data-page="stats">⌁ &nbsp; My Progress</button><button data-page="settings">⚙ &nbsp; Data & backup</button></div>
  <dialog id="dialog" class="dialog"><form id="modal-form"><header class="dialog-head"><div><span class="kicker">UNIFLOW</span><h2 id="modal-title">New item</h2></div><button id="modal-close" class="close" type="button" aria-label="Close">×</button></header><div id="modal-fields" class="form-grid"></div><footer class="dialog-actions"><button id="modal-cancel" class="btn soft" type="button">Cancel</button><button class="btn primary" type="submit">Save <span>↗</span></button></footer></form></dialog>
  <dialog id="class-detail-dialog" class="dialog class-detail-dialog"><div class="class-detail"><header class="dialog-head"><div><span class="kicker">TIMETABLE CLASS</span><h2 id="class-detail-title"></h2><p id="class-detail-meta"></p></div><button class="close" type="button" data-action="close-class-dialog" aria-label="Close">×</button></header><p id="class-detail-room"></p><div class="dialog-actions"><button class="btn soft" data-action="class-move">Move class</button><button class="btn soft" data-action="class-edit">Edit</button><button class="btn danger-btn" data-action="class-delete">Delete class</button></div></div></dialog>
  <dialog id="confirm-dialog" class="dialog confirm-dialog"><div class="confirm-body"><h2>Confirm deletion</h2><p id="confirm-message"></p><div class="dialog-actions"><button class="btn soft" data-action="confirm-cancel">Cancel</button><button class="btn danger-btn" data-action="confirm-delete">Delete</button></div></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
